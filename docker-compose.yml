services:
  backend:
    build:
      context: ./backend
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:?Set two real provider keys in .env}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-2.0-flash}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      LLM_CACHE_ENABLED: ${LLM_CACHE_ENABLED:-true}
    ports:
      - "8000:8000"
    volumes:
      - app-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"

volumes:
  app-data:

